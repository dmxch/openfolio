# --- Echte Client-IP ---------------------------------------------------------
# Der Container ist nur über 127.0.0.1:5173 des Hosts erreichbar
# (docker-compose.yml). Jeder Request kommt darum vom Docker-Gateway; dahinter
# steht der Browser am Host oder ein Reverse Proxy bzw. Tunnel. Ohne realip wäre
# $remote_addr für alle Nutzer dieselbe Adresse, und limit_req gäbe allen
# zusammen ein einziges Budget.
#
# Vertraut wird nur Absendern aus Loopback und privaten Netzen. Von ihnen gilt
# der RECHTE Eintrag aus X-Forwarded-For (real_ip_recursive off): Ihn setzt der
# vorgelagerte Proxy selbst, alles links davon wählt der Client frei. Das
# Backend rechnet gleich (TRUSTED_PROXY_HOPS=1). Wer den Port nach aussen
# öffnet, lässt Clients aus privaten Netzen ihre Adresse selbst bestimmen.
set_real_ip_from 127.0.0.0/8;
set_real_ip_from 10.0.0.0/8;
set_real_ip_from 172.16.0.0/12;
set_real_ip_from 192.168.0.0/16;
set_real_ip_from ::1/128;
set_real_ip_from fc00::/7;
real_ip_header X-Forwarded-For;
real_ip_recursive off;

# Dieselbe Liste wie set_real_ip_from, hier für die TCP-Gegenstelle
# ($realip_remote_addr bleibt die Adresse vor der Ersetzung durch realip).
geo $realip_remote_addr $peer_is_trusted_proxy {
    default        0;
    127.0.0.0/8    1;
    10.0.0.0/8     1;
    172.16.0.0/12  1;
    192.168.0.0/16 1;
    ::1/128        1;
    fc00::/7       1;
}

# CF-Connecting-IP zählt nur als Ersatz: von einem vertrauten Absender, der
# kein X-Forwarded-For mitgibt. Ein Proxy ohne Cloudflare davor reicht den
# Header ungeprüft vom Client durch; hätte er Vorrang, könnte jeder Client
# seine Adresse fälschen und Rate-Limits, Audit-Log und Sitzungsliste täuschen.
# Der Trenner "|" kommt in keiner IP vor.
map "$peer_is_trusted_proxy|$http_x_forwarded_for|$http_cf_connecting_ip" $client_real_ip {
    default                                        $remote_addr;
    "~^1\|\|(?<cf_connecting_ip>[0-9A-Fa-f.:]{3,45})$" $cf_connecting_ip;
}

# Rate limiting zone for API proxy (must be in http context, outside server block)
# Schlüssel ist die echte Client-IP, damit jeder Client sein eigenes Budget hat.
# Äussere Flutbremse: Die Rate entspricht dem höchsten Routen-Limit des Backends
# (RL_TICKER_READ in backend/constants/limits.py). Die Limits je Route setzt das
# Backend.
limit_req_zone $client_real_ip zone=api:10m rate=300r/m;

server {
    listen 5173;
    server_name _;
    server_tokens off;
    root /usr/share/nginx/html;
    index index.html;

    # Request body size limit
    client_max_body_size 10m;

    # Gzip compression
    gzip on;
    gzip_types text/plain text/markdown text/css application/json application/javascript text/xml application/xml text/javascript image/svg+xml application/font-woff font/woff2;
    gzip_min_length 1024;
    gzip_comp_level 6;
    gzip_vary on;

    # Security headers
    # CSP Note (2026-07-27, nach Security-Report NIEDRIG #3):
    #   script-src braucht WEDER 'unsafe-inline' NOCH 'unsafe-eval' — beides war eine
    #   unbelegte Annahme. Verifiziert: der Vite-Build erzeugt keinen einzigen Inline-
    #   Script-Block (dist/index.html laedt nur /assets/*.js) und kein dist-Asset nutzt
    #   eval()/new Function(); die TradingView-Loader (embed-widget-advanced-chart.js,
    #   embed-widget-mini-symbol-overview.js) ebenfalls nicht — sie erzeugen nur div/
    #   iframe/style. Browser-Test unter genau dieser CSP: beide Widgets rendern, null
    #   securitypolicyviolation. Die JSON-Config in script.innerHTML ist unkritisch,
    #   weil das Script ein src hat und der Inline-Text daher nie ausgefuehrt wird.
    #   BEIM WIEDER-EINBAUEN VON INLINE-SCRIPTS oder eval-nutzenden Libs bricht die App
    #   sichtbar (Console: "Refused to execute inline script") — dann Nonce/Hash statt
    #   'unsafe-inline' nachziehen, nicht einfach zurueckdrehen.
    #   style-src 'unsafe-inline' bleibt noetig: Tailwind/React setzen Inline-Styles und
    #   der TradingView-Loader injiziert ein <style>-Element.
    #   frame-ancestors 'none' setzt den Clickjacking-Schutz per CSP — das schlaegt in
    #   modernen Browsern ein widerspruechliches X-Frame-Options einer vorgelagerten
    #   Schicht. Konkret sendet auf app.openfolio.cc eine zweite Proxy-Ebene SAMEORIGIN,
    #   waehrend hier DENY steht; aufzuraeumen ist das trotzdem (Host-Config VM220).
    #   img-src nennt neben 'self' und data: nur den Logo-Host aus
    #   src/components/TickerLogo.jsx. Ein pauschales https: liesse jede Bild-URL zu
    #   und damit einen Abflusskanal (künftige Injektion). connect-src: Das Frontend
    #   ruft nur die eigene API; CoinGecko und FRED fragt das Backend ab.
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' https://s3.tradingview.com; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://assets.parqet.com; font-src 'self'; connect-src 'self' https://*.tradingview.com; frame-src https://s.tradingview.com https://*.tradingview.com https://*.tradingview-widget.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none';" always;

    # API proxy
    location /api/ {
        limit_req zone=api burst=60 nodelay;
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $client_real_ip;
        # ÜBERSCHREIBEN statt anhängen ($proxy_add_x_forwarded_for): der
        # erste XFF-Eintrag wäre sonst client-kontrolliert und spoofbar —
        # er landet in Rate-Limit-Keys, Audit-Log und Login-Historie
        # (Review 2026-06-10, H6). Das Backend erhält genau einen Wert.
        proxy_set_header X-Forwarded-For $client_real_ip;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 10s;
        proxy_read_timeout 120s;
        proxy_send_timeout 60s;
        add_header Cache-Control "no-store, no-cache, must-revalidate" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'none'; frame-ancestors 'none';" always;
    }

    # SPA fallback
    location / {
        try_files $uri $uri/ /index.html;
    }

    # index.html immer revalidieren. Ohne Cache-Control darf der Browser die Datei
    # nach Heuristik rund einen Tag wiederverwenden und startet nach einem Deploy
    # weiter das alte Bundle. Der Block gilt auch für "/" und jede SPA-Route:
    # index und try_files leiten intern auf /index.html um. `expires` statt
    # `add_header`, Begründung siehe /sw.js unten.
    location = /index.html {
        expires -1;
    }

    # mime.types kennt .md nicht; die Datei ginge sonst als
    # application/octet-stream ohne gzip hinaus.
    location = /changelog.md {
        types { }
        default_type text/markdown;
        charset utf-8;
        charset_types text/markdown;
    }

    # Cache static assets
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "0" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; frame-ancestors 'none';" always;
    }

    # Service Worker + Manifest: nie langfristig cachen, damit App-Updates
    # zuverlaessig durchschlagen (SW-Script wird ohnehin vom Browser revalidiert).
    # `expires` statt `add_header Cache-Control` — ein add_header im Child-Block
    # wuerde die Vererbung der server-level Security-Header (HSTS/CSP/...) kappen;
    # `expires -1` setzt Cache-Control: no-cache OHNE diese Vererbung zu brechen.
    location = /sw.js {
        expires -1;
    }
    location = /manifest.webmanifest {
        expires -1;
    }
}
